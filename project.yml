name: HermesCompanion
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  HermesCompanion:
    type: application
    platform: iOS
    sources:
      - path: HermesCompanion
      - path: Shared
    dependencies:
      - target: HermesCompanionWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hermes.companion
        PRODUCT_NAME: HermesCompanion
        INFOPLIST_FILE: HermesCompanion/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: HermesCompanion/Resources/HermesCompanion.entitlements
        ENABLE_PREVIEWS: YES
    info:
      path: HermesCompanion/Resources/Info.plist
      properties:
        CFBundleDisplayName: Hermes
        CFBundleURLTypes:
          - CFBundleURLName: dev.hermes.companion.deep
            CFBundleURLSchemes:
              - hermes
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Hermes uses the camera to scan a Desktop pairing QR when you choose to connect.
        NSMicrophoneUsageDescription: Hermes can record voice prompts when you choose voice input.
        NSSpeechRecognitionUsageDescription: Hermes transcribes your voice prompt on-device when you use voice input.
        NSPhotoLibraryUsageDescription: Hermes can attach selected images to prompts.
        BGTaskSchedulerPermittedIdentifiers:
          - dev.hermes.companion.pending
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  HermesCompanionTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: HermesCompanion
    sources:
      - path: HermesCompanionTests
    dependencies:
      - target: HermesCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hermes.companion.tests
        GENERATE_INFOPLIST_FILE: YES
  HermesCompanionWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HermesCompanionWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hermes.companion.widget
        PRODUCT_NAME: HermesCompanionWidget
        CODE_SIGN_ENTITLEMENTS: HermesCompanionWidget/HermesCompanionWidget.entitlements
        SWIFT_VERSION: 6.0
    info:
      path: HermesCompanionWidget/Info.plist
      properties:
        CFBundleDisplayName: Hermes
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  HermesCompanion:
    build:
      targets:
        HermesCompanion: all
    test:
      targets:
        - HermesCompanionTests
